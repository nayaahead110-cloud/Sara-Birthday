  <title>Sara ♡</title>  <link rel="stylesheet" href="style.css"></head><body>  <div class="stars"></div>  <!-- =========================
       الصفحة الرئيسية
  ========================= -->  <main class="hero" id="hero"><div class="small-title">
  A LITTLE SURPRISE FOR
</div>

<h1>
  Sara
</h1>

<p class="intro">
  فيه شيء صغير صنع لك من القلب...
</p>

<button
  id="openButton"
  class="main-button"
>
  افتحي هديتك
  <span>♡</span>
</button>

  </main>  <!-- =========================
       المفاجأة الأولى
  ========================= -->  <section
    id="surprise"
    class="surprise hidden"
  ><div class="gift-icon">
  🎁
</div>

<h2>
  عندي لك كم شيء...
</h2>

<p>
  بس لازم تكمّلين للنهاية
  عشان توصّلين لآخر مفاجأة.
</p>

<button
  id="nextButton"
  class="main-button"
>
  كمّلي
  <span>→</span>
</button>

  </section>  <!-- =========================
       المرحلة قبل الرسالة الأخيرة
  ========================= -->  <section
    id="beforeMessage"
    class="surprise hidden"
  ><div class="gift-icon">
  ♡
</div>

<h2>
  باقي شيء واحد...
</h2>

<p>
  وصلتي لآخر خطوة تقريبًا.
  <br><br>
  قبل ما تنتهي الهدية،
  فيه كلمة أخيرة أبيك تقرينها بنفسك.
</p>

<button
  id="messageButton"
  class="main-button"
>
  كمّلي المفاجأة
  <span>♡</span>
</button>

  </section>  <script>

    const openButton =
      document.getElementById("openButton");

    const nextButton =
      document.getElementById("nextButton");

    const messageButton =
      document.getElementById("messageButton");

    const hero =
      document.getElementById("hero");

    const surprise =
      document.getElementById("surprise");

    const beforeMessage =
      document.getElementById("beforeMessage");


    /* =========================
       فتح الهدية
    ========================= */

    openButton.addEventListener("click", () => {

      hero.style.opacity = "0";
      hero.style.transform = "scale(.96)";

      setTimeout(() => {

        hero.style.display = "none";

        surprise.classList.remove("hidden");

        requestAnimationFrame(() => {
          surprise.classList.add("active");
        });

      }, 600);

    });


    /* =========================
       الانتقال للمرحلة الجديدة
    ========================= */

    nextButton.addEventListener("click", () => {

      surprise.style.opacity = "0";
      surprise.style.transform = "translateY(-15px)";

      setTimeout(() => {

        surprise.style.display = "none";

        beforeMessage.classList.remove("hidden");

        requestAnimationFrame(() => {
          beforeMessage.classList.add("active");
        });

      }, 500);

    });


    /* =========================
       الرسالة الأخيرة
    ========================= */

    messageButton.addEventListener("click", () => {

      document.body.style.transition =
        "opacity .7s ease";

      document.body.style.opacity = "0";

      setTimeout(() => {

        window.location.href =
          "message.html";

      }, 700);

    });

  </script></body></html>
